[workspace]
members = [".", "codegen", "benches"]
resolver = "2"

[package]
name = "unitsnet-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Strongly-typed physical quantities and unit conversions"
license = "MIT OR Apache-2.0"
keywords = ["units", "measurement", "physics", "conversion"]
categories = ["science", "no-std", "no-std::no-alloc"]

[features]
default = ["std"]
## Math functions (`sqrt`, trigonometry, `hypot`, …) through the standard
## library. Disable default features for `no_std`.
std = []
## The same math functions on `no_std` targets, through the `libm` crate.
libm = ["dep:libm"]
## `Serialize`/`Deserialize` for every quantity (as its bare base-unit number)
## and every unit enum.
serde = ["dep:serde"]

[dependencies]
libm = { version = "0.2", optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
