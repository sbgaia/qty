[workspace]
members = [".", "codegen", "benches"]
resolver = "2"

[package]
name = "unitsnet-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Zero-overhead, strongly-typed physical quantities and unit conversions, generated from UnitsNet"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sbgaia/unitsnet-rs"
documentation = "https://docs.rs/unitsnet-rs"
readme = "README.md"
# The generator, its data, benchmarks and CI are not needed by users.
include = ["src/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE*"]
keywords = ["units", "measurement", "physics", "conversion", "no-std"]
categories = ["science", "no-std", "no-std::no-alloc"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "full"]

## Every quantity. Disable default features and pick groups to compile only
## what you use; the core quantities (length, mass, duration, speed, force,
## energy, power, pressure, temperature, angle, …) are always available.
full = [
    "mechanics",
    "fluids",
    "electrical",
    "thermal",
    "chemistry",
    "light",
    "radiation",
    "information",
    "misc",
]
## Torque, jerk, impulse, rotational quantities, moments of inertia, densities
## per length/area, specific energy and volume, …
mechanics = []
## Flows, fluxes, viscosities, fluid resistance, permeability, leak rate.
fluids = []
## Electric and magnetic quantities, and decibel levels (dBV, dBm, Level).
electrical = []
## Entropy, heat flux and transfer, thermal conductivity and resistance, …
thermal = []
## Amount of substance, molar quantities, concentrations and fractions.
chemistry = []
## Luminous and radiant quantities, solid angle.
light = []
## Ionizing radiation: absorbed and equivalent dose, exposure, activity.
radiation = []
## Information and bit rate.
information = []
## Fuel consumption and efficiency, humidity, turbidity, vitamin A.
misc = []

## Math functions (`sqrt`, trigonometry, `hypot`, …) through the standard
## library. Disable default features for `no_std`.
std = []
## The same math functions on `no_std` targets, through the `libm` crate.
libm = ["dep:libm"]
## `Serialize`/`Deserialize` for every quantity (as its bare base-unit number)
## and every unit enum.
serde = ["dep:serde"]
## `AbsDiffEq`/`RelativeEq`/`UlpsEq` from `approx`, for `assert_relative_eq!`.
approx = ["dep:approx"]
## `num_traits::Zero` for amount quantities and `Fixed`.
num-traits = ["dep:num-traits"]
## `Pod`, `Zeroable` and `TransparentWrapper` from `bytemuck`, for zero-copy
## casts of quantity buffers to and from bytes.
bytemuck = ["dep:bytemuck"]
## `defmt::Format`, for logging on embedded targets.
defmt = ["dep:defmt"]

[dependencies]
approx = { version = "0.5", default-features = false, optional = true }
bytemuck = { version = "1", default-features = false, optional = true }
defmt = { version = "0.3", optional = true }
libm = { version = "0.2", optional = true }
num-traits = { version = "0.2", default-features = false, optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
