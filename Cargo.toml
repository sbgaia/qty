[workspace]
members = [".", "codegen"]
# Projects with their own workspace and lockfile: the fuzz targets need nightly
# and `cargo fuzz` (see fuzz/README.md); the benchmarks pull in criterion and
# the crates qty is compared with.
exclude = ["fuzz", "benches"]
resolver = "2"

[package]
name = "qty"
version = "0.5.1"
edition = "2021"
rust-version = "1.82"
description = "Strongly typed physical quantities and unit conversions: fast to compile, no dependencies, zero runtime overhead"
license = "MIT"
repository = "https://github.com/sbgaia/qty"
documentation = "https://docs.rs/qty"
readme = "README.md"
# The generator, its data, benchmarks and CI are not needed by users.
include = ["src/**/*.rs", "src/**/*.md", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]
keywords = ["units", "dimensional-analysis", "measurement", "physics", "conversion"]
categories = ["science", "no-std", "no-std::no-alloc", "embedded", "value-formatting"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std", "full"]

## Every quantity. Disable default features and pick groups to compile only
## what you use; the core quantities (length, mass, duration, speed, force,
## energy, power, pressure, temperature, angle, …) are always available.
full = [
    "mechanics",
    "fluids",
    "electrical",
    "thermal",
    "chemistry",
    "light",
    "radiation",
    "information",
    "misc",
]
## Torque, jerk, impulse, rotational quantities, moments of inertia, densities
## per length/area, specific energy and volume, …
mechanics = []
## Flows, fluxes, viscosities, fluid resistance, permeability, leak rate.
fluids = []
## Electric and magnetic quantities, and decibel levels (dBV, dBm, Level).
electrical = []
## Entropy, heat flux and transfer, thermal conductivity and resistance, …
thermal = []
## Amount of substance, molar quantities, concentrations and fractions.
chemistry = []
## Luminous and radiant quantities, solid angle.
light = []
## Ionizing radiation: absorbed and equivalent dose, exposure, activity.
radiation = []
## Information and bit rate.
information = []
## Fuel consumption and efficiency, humidity, turbidity, vitamin A.
misc = []

## Math functions (`sqrt`, trigonometry, `hypot`, …) through the standard
## library. Disable default features for `no_std`.
std = []
## The same math functions on `no_std` targets, through the `libm` crate.
libm = ["dep:libm"]
## `Serialize`/`Deserialize` for every quantity (as its bare base-unit number)
## and every unit enum.
serde = ["dep:serde_core", "dep:serde"]
## `AbsDiffEq`/`RelativeEq`/`UlpsEq` from `approx`, for `assert_relative_eq!`.
approx = ["dep:approx"]
## `Pod`, `Zeroable` and `TransparentWrapper` from `bytemuck`, for zero-copy
## casts of quantity buffers to and from bytes.
bytemuck = ["dep:bytemuck"]
## `defmt::Format`, for logging on embedded targets.
defmt = ["dep:defmt"]
## Conversions between `Duration` and `chrono::TimeDelta`.
chrono = ["dep:chrono"]
## Conversions between `Duration` and `time::Duration`.
time = ["dep:time"]
## JSON schemas (`schemars::JsonSchema`) for quantities and unit enums.
schemars = ["dep:schemars", "std"]
## Complex storage, `Length<Complex<f64>>`, for phasors and other AC
## quantities.
num-complex = ["dep:num-complex"]
## Decimal storage, `Length<rust_decimal::Decimal>`, where the conversion
## factors are exact decimals.
rust_decimal = ["dep:rust_decimal"]
## Rational storage, `Length<Ratio<i64>>`, for exact arithmetic.
num-rational = ["dep:num-rational"]
## `Fixed`: integer counts in any unit, such as `Fixed<Millimeter>`, with
## exact conversions and products, and its unit markers in `unit`
## (adds about 20 % to the crate's compile time).
fixed = []
## Quantities whose kind is known only at runtime: `AnyQuantity`, `AnyUnit`,
## `QuantityKind` (adds about 15 % to the crate's compile time).
dynamic = []

[dependencies]
approx = { version = "0.5", default-features = false, optional = true }
bytemuck = { version = "1", default-features = false, optional = true }
defmt = { version = "1", optional = true }
chrono = { version = "0.4.35", default-features = false, optional = true }
schemars = { version = "1", default-features = false, features = ["std"], optional = true }
time = { version = "0.3", default-features = false, optional = true }
libm = { version = "0.2", optional = true }
num-complex = { version = "0.4.6", default-features = false, optional = true }
num-rational = { version = "0.4.2", default-features = false, optional = true }
rust_decimal = { version = "1.36", default-features = false, optional = true }
serde_core = { version = "1.0.220", default-features = false, optional = true }

# Never built: keeps `serde` at a version that re-exports the `serde_core`
# traits, so the impls are the ones `serde::Serialize` names.
[target.'cfg(any())'.dependencies]
serde = { version = "1.0.220", default-features = false, optional = true }

# Examples that need more than the default core quantities.
[[example]]
name = "projectile"
required-features = ["std", "mechanics"]

[[example]]
name = "config"
required-features = ["serde"]

[[example]]
name = "sensor"
required-features = ["fixed"]

[dev-dependencies]
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
# The library implements serde by hand; tests and examples derive it.
serde = { version = "1", features = ["derive"] }
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
