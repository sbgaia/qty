[package]
name = "unitsnet-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
unitsnet-rs = { path = "..", features = ["full"] }

# Not part of the main workspace: needs nightly and `cargo fuzz`.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fixed"
path = "fuzz_targets/fixed.rs"
test = false
doc = false
bench = false
