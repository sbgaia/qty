[package]
name = "qty-benches"
version = "0.1.0"
edition = "2021"
publish = false

# Only dev-dependencies: this crate exists to run the benchmarks.
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

# The library under test.
qty = { path = ".." }

# Competitor libraries.
# uom: dimensions checked through type parameters.
uom = { version = "0.37", features = ["si", "f64"] }

# simple-si-units: SI units generic over the number type.
simple-si-units = "1.1"

# measurements: one struct per quantity.
measurements = "0.11"

# ferrunitas: zero-sized unit markers.
ferrunitas = "0.4"

# measures-rs: a macro-generated unit system. Its library is called `measures`.
measures = { package = "measures-rs", version = "0.1" }

[[bench]]
name = "compare"
harness = false
