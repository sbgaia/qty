name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --no-deps --all-features -p unitsnet-rs

  test:
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--all-features", "--no-default-features --features libm"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p unitsnet-rs -p codegen ${{ matrix.features }}

  msrv:
    name: MSRV (1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82
      - uses: Swatinem/rust-cache@v2
      # The library and its tests; codegen and benches are dev tools that may
      # need a newer toolchain.
      - run: cargo test -p unitsnet-rs --all-features --lib --test design --test cross_type

  no-std:
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # No `std` on this target: the math functions come from `libm`.
      - run: cargo build -p unitsnet-rs --no-default-features --features serde,libm,approx,num-traits,bytemuck,defmt --target thumbv7em-none-eabihf
      - run: cargo build -p unitsnet-rs --no-default-features --target thumbv7em-none-eabihf

  feature-groups:
    name: Feature groups build alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Core quantities only, with tests.
      - run: cargo test -p unitsnet-rs --no-default-features --features std
      # Each group on its own: catches cross-quantity relations that are not
      # gated on every group they involve.
      - name: Each group alone
        run: |
          for group in mechanics fluids electrical thermal chemistry light radiation information misc; do
            echo "::group::$group"
            cargo check -p unitsnet-rs --all-targets --no-default-features --features "std $group"
            echo "::endgroup::"
          done

  fuzz:
    name: Fuzz (1 minute per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Fuzz
        working-directory: fuzz
        # The prebuilt cargo-fuzz is a musl binary and would default to the
        # musl target, which has no AddressSanitizer: name the target.
        run: |
          for target in parse fixed; do
            cargo fuzz run "$target" -O --target x86_64-unknown-linux-gnu -- -max_total_time=60
          done

  codegen:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # Downloads the definitions at the UnitsNet commit pinned in the script.
      - run: ./scripts/download.sh --current
      - run: cargo run -p codegen
      - name: Check for differences
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated code is out of date: run ./scripts/download.sh --current && cargo run -p codegen"
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            echo "::error::Codegen produced untracked files: $untracked"
            exit 1
          fi

  benches:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p unitsnet-benches --no-run
