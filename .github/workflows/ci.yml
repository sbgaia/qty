name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --no-deps --all-features -p qty
      # Links to feature-gated items must not break the docs without them.
      - run: cargo doc --no-deps --no-default-features -p qty

  test:
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "--all-features", "--no-default-features --features libm"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p qty -p codegen ${{ matrix.features }}
      # The examples check their own results.
      - if: matrix.features == '--all-features'
        run: for example in sensor projectile config; do cargo run --all-features --example "$example"; done

  msrv:
    name: MSRV (1.82)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.82
      - uses: Swatinem/rust-cache@v2
      # The library and its tests; codegen and benches are dev tools that may
      # need a newer toolchain.
      - run: cargo test -p qty --all-features --lib --test design --test cross_type --test formula --test storage --test arith

  no-std:
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # No `std` on this target: the math functions come from `libm`.
      - run: cargo build -p qty --no-default-features --features serde,libm,approx,bytemuck,defmt,dynamic,fixed,num-complex,rust_decimal,num-rational --target thumbv7em-none-eabihf
      - run: cargo build -p qty --no-default-features --target thumbv7em-none-eabihf

  feature-groups:
    name: Feature groups build alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Core quantities only, with tests.
      - run: cargo test -p qty --no-default-features --features std
      - run: cargo test -p qty --no-default-features --features "std dynamic"
      # Each group on its own: catches cross-quantity relations that are not
      # gated on every group they involve.
      - name: Each group alone
        run: |
          for group in mechanics fluids electrical thermal chemistry light radiation information misc; do
            echo "::group::$group"
            cargo check -p qty --all-targets --no-default-features --features "std dynamic $group"
            echo "::endgroup::"
          done

  fuzz:
    name: Fuzz (1 minute per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Fuzz
        working-directory: fuzz
        # The prebuilt cargo-fuzz is a musl binary and would default to the
        # musl target, which has no AddressSanitizer: name the target.
        run: |
          for target in parse fixed; do
            cargo fuzz run "$target" -O --target x86_64-unknown-linux-gnu -- -max_total_time=60
          done

  semver:
    name: Semver (against the latest release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - uses: Swatinem/rust-cache@v2
      # Fails on a breaking change whose version was not bumped. Skips until
      # the crate is first published.
      - name: Check
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -A "qty CI (https://github.com/sbgaia/qty)" \
            https://crates.io/api/v1/crates/qty)
          if [ "$status" = 404 ]; then
            echo "::notice::qty is not on crates.io yet: nothing to compare with."
          else
            cargo semver-checks -p qty
          fi

  codegen:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # Downloads the definitions at the UnitsNet commit pinned in the script.
      - run: ./scripts/download.sh --current
      - run: cargo run -p codegen
      - name: Check for differences
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated code is out of date: run ./scripts/download.sh --current && cargo run -p codegen"
            exit 1
          fi
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            echo "::error::Codegen produced untracked files: $untracked"
            exit 1
          fi

  package:
    name: Published crate builds with every feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo package` verifies the default features only: a file missing
      # from `include` would break the others for crates.io users.
      - run: cargo package -p qty --no-verify
      - name: Build the packaged crate
        run: |
          mkdir "$RUNNER_TEMP/package"
          tar -xzf target/package/qty-*.crate -C "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP"/package/qty-*
          cargo build --all-features

  benches:
    name: Benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p qty-benches --no-run
